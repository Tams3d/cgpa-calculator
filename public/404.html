<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 | Page not found</title>
    <meta
      name="description"
      content="The page you are looking for does not exist. Go back to the CGPA Calculator for engineering students."
    />
    <link rel="canonical" href="https://tams-cgpa-calculator.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #fafafb;
        color: #1b1c1e;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
        padding: 2rem 1.25rem;
      }
      .card {
        max-width: 480px;
      }
      .code {
        font-size: 5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        margin: 0;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0.75rem 0 0.5rem;
        letter-spacing: -0.02em;
      }
      p {
        color: #6e7076;
        line-height: 1.6;
        margin: 0 0 1.75rem;
        font-size: 1rem;
      }
      a {
        display: inline-block;
        background: #5856d6;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        transition: opacity 0.15s ease;
      }
      a:hover {
        opacity: 0.9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
        }
        body {
          background: #08090a;
          color: #ececee;
        }
        p {
          color: #8a8c90;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist or has moved.</p>
      <a href="/">Go back to the calculator</a>
    </div>
  </body>
</html>
